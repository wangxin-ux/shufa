        '200': { description: Campaign closed or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCampaignEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /management/group-campaigns/{campaignId}/cancel:
    post:
      operationId: cancelManagementGroupCampaign
      summary: Cancel an unsettled campaign and start refunds
      tags: [Management]
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionedReasonedActionRequest' } } } }
      responses:
        '200': { description: Campaign cancelled or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCampaignEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /management/group-orders:
    get:
      operationId: listManagementGroupOrders
      summary: List group orders, payment, settlement and refund status
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: campusId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/GroupMemberStatus' }
      responses:
        '200': { description: Management group order page, content: { application/json: { schema: { $ref: '#/components/schemas/GroupOrdersPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /media/group-campaign-posters/{storedFileId}:
    get:
      operationId: readGroupCampaignPoster
      summary: Read one campaign poster using a short-lived signed URL
      tags: [System]
      security: []
      parameters:
        - $ref: '#/components/parameters/StoredFileId'
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Campaign poster bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /media/customer-service-qr/{storedFileId}:
    get:
      operationId: readCustomerServiceQr
      summary: Read one campus customer-service QR using a short-lived signed URL
      tags: [System]
      security: []
      parameters:
        - $ref: '#/components/parameters/StoredFileId'
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Customer-service QR image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
  /management/group-orders/{orderId}/refund:
    post:
      operationId: refundManagementGroupOrder
      summary: Request an original-channel refund for one group order
      tags: [Management]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GroupRefundRequest' } } } }
      responses:
        '200': { description: Refund requested or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/GroupOrderEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /management/rosters/{kind}/template:
    get:
      operationId: downloadGlobalRosterTemplate
      summary: Download a versioned global roster template
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
      responses:
        '200': { $ref: '#/components/responses/XlsxFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /management/rosters/{kind}/preview:
    post:
      operationId: previewGlobalRosterImport
      summary: Validate a global customer or teacher roster without writing
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
      requestBody:
        $ref: '#/components/requestBodies/RosterWorkbook'
      responses:
        '200': { $ref: '#/components/responses/RosterPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /management/rosters/{kind}/import:
    post:
      operationId: importGlobalRoster
      summary: Import valid global roster rows with stable row idempotency
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
      requestBody:
        $ref: '#/components/requestBodies/RosterWorkbook'
      responses:
        '200': { $ref: '#/components/responses/RosterImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /management/rosters/{kind}/entries:
    post:
      operationId: createGlobalRosterEntry
      summary: Quickly create one customer or teacher roster entry
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ManagementCustomerRosterEntryRequest'
                - $ref: '#/components/schemas/ManagementTeacherRosterEntryRequest'
      responses:
        '200': { $ref: '#/components/responses/RosterRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /management/rosters/{kind}/export:
    get:
      operationId: exportGlobalRoster
      summary: Export filtered roster rows with complete phones after confirmation
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
        - $ref: '#/components/parameters/ConfirmedPhoneExport'
        - name: campusId
          in: query
          schema: { type: string, format: uuid }
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/XlsxFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /management/rosters/teachers:
    get:
      operationId: listGlobalRosterTeachers
      summary: List teachers across campuses for roster management
      tags: [Management]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: campusId
          in: query
          schema: { type: string, format: uuid }
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/TeacherRosterPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /campus-managers/me/rosters/{kind}/template:
    get:
      operationId: downloadCampusRosterTemplate
      summary: Download a versioned template without a campus column
      tags: [CampusManager]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
      responses:
        '200': { $ref: '#/components/responses/XlsxFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /campus-managers/me/rosters/{kind}/preview:
    post:
      operationId: previewCampusRosterImport
      summary: Validate a roster in the authenticated manager campus
      tags: [CampusManager]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
      requestBody:
        $ref: '#/components/requestBodies/RosterWorkbook'
      responses:
        '200': { $ref: '#/components/responses/RosterPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /campus-managers/me/rosters/{kind}/import:
    post:
      operationId: importCampusRoster
      summary: Import valid rows into the authenticated manager campus
      tags: [CampusManager]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
      requestBody:
        $ref: '#/components/requestBodies/RosterWorkbook'
      responses:
        '200': { $ref: '#/components/responses/RosterImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /campus-managers/me/rosters/{kind}/entries:
    post:
      operationId: createCampusRosterEntry
      summary: Quickly create one scoped customer or teacher entry
      tags: [CampusManager]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomerRosterEntryRequest'
                - $ref: '#/components/schemas/TeacherRosterEntryRequest'
      responses:
        '200': { $ref: '#/components/responses/RosterRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /campus-managers/me/rosters/{kind}/export:
    get:
      operationId: exportCampusRoster
      summary: Export the authenticated campus roster with complete phones
      tags: [CampusManager]
      parameters:
        - $ref: '#/components/parameters/RosterKind'
        - $ref: '#/components/parameters/ConfirmedPhoneExport'
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/XlsxFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /campus-managers/me/rosters/teachers:
    get:
      operationId: listCampusRosterTeachers
      summary: List teachers in the authenticated manager campus
      tags: [CampusManager]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/TeacherRosterPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the authentication module.
  parameters:
    RosterKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [customers, teachers]
    ConfirmedPhoneExport:
      name: confirmed
      in: query
      required: true
      description: Must be true after a client-side second confirmation for full phone export.
      schema:
        type: boolean
        enum: [true]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional caller-generated correlation identifier. Invalid values are
        replaced by a server-generated UUID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key used by mutation endpoints to make retries safe.
        Keys contain 8-128 letters, numbers, dots, underscores, colons, or
        hyphens.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
      example: lesson-confirm-20260827-0001
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PartnerReportPeriod:
      name: period
      in: query
      required: false
      description: Campus-timezone reporting period. Omit for all-time earning reads.
      schema:
        $ref: '#/components/schemas/PartnerReportPeriod'
    PartnerAnchorDate:
      name: anchorDate
      in: query
      required: false
      description: Local campus calendar date used to resolve the selected period.
      schema:
        type: string
        format: date
    FromDateTime:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive range start in RFC 3339 format with an explicit offset.
    ToDateTime:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Exclusive range end in RFC 3339 format with an explicit offset.
    LessonSessionId:
      name: lessonSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoredFileId:
      name: storedFileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseProductId:
      name: courseProductId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentOrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WithdrawalId:
      name: withdrawalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EarningRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WithdrawalPolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EarningEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParentStudentId:
      name: studentId
      in: query
      required: false
      description: >-
        Bound student to read. When omitted, the primary active binding is used.
        Supplying an unbound or cross-campus student is forbidden.
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: Correlation identifier matching the response body requestId.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
  requestBodies:
    RosterWorkbook:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: CUSTOMER_V1 or TEACHER_V1 XLSX file, at most 5 MB and 2000 data rows.
            additionalProperties: false
  responses:
    XlsxFile:
      description: XLSX workbook bytes.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Disposition:
          schema: { type: string }
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
    RosterPreview:
      description: Row-level validation results without writes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RosterPreviewEnvelope' }
    RosterImport:
      description: Partial-success import result and optional base64 error receipt.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RosterImportEnvelope' }
    RosterRow:
      description: Quick-entry row result.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RosterRowEnvelope' }
    TeacherRosterPage:
      description: Paginated teacher roster with masked phone numbers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TeacherRosterPageEnvelope' }
    BadRequest:
      description: Request validation failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication is required or the session is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The authenticated user lacks the required role or data scope.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The requested state transition conflicts with current state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResourceNotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            missingResource:
              value:
                code: RESOURCE_NOT_FOUND
                message: Cannot GET /resource
                requestId: 64ea9657-41f1-4baf-a3fb-d62e39054016
                details: {}
    InternalServerError:
      description: An unexpected server error occurred.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internalError:
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
                requestId: 64ea9657-41f1-4baf-a3fb-d62e39054016
                details: {}
  schemas:
    FinanceReceiptCorrection:
      $ref: './finance-corrections.openapi.yaml#/schemas/Correction'
    FinanceReceiptCorrectionCreate:
      $ref: './finance-corrections.openapi.yaml#/schemas/CreateCorrection'
    FinanceReceiptCorrectionAction:
      $ref: './finance-corrections.openapi.yaml#/schemas/CorrectionAction'
    FinanceRefund:
      $ref: './finance-refunds.openapi.yaml#/schemas/Refund'
    FinanceRefundCreate:
      $ref: './finance-refunds.openapi.yaml#/schemas/CreateRefund'
    FinanceRefundAction:
      $ref: './finance-refunds.openapi.yaml#/schemas/RefundAction'
    RosterTemplateVersion:
      type: string
      enum: [CUSTOMER_V1, TEACHER_V1]
    RosterRowStatus:
      type: string
      enum: [VALID, CREATED, DUPLICATE, ERROR]
    RosterRowResult:
      type: object
      required: [rowNumber, status, reason, values]
      properties:
        rowNumber: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/RosterRowStatus' }
        reason: { type: string }
        values:
          type: array
          items: { type: string }
    RosterPreviewView:
      type: object
      required: [templateVersion, fileHash, totalRows, validCount, duplicateCount, errorCount, rows]
      properties:
        templateVersion: { $ref: '#/components/schemas/RosterTemplateVersion' }
        fileHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        totalRows: { type: integer, minimum: 0, maximum: 2000 }
        validCount: { type: integer, minimum: 0, maximum: 2000 }
        duplicateCount: { type: integer, minimum: 0, maximum: 2000 }
        errorCount: { type: integer, minimum: 0, maximum: 2000 }
        rows:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/RosterRowResult' }
    RosterImportView:
      type: object
      required: [templateVersion, fileHash, totalRows, importedCount, duplicateCount, errorCount, rows, errorReceiptFileName, errorReceiptBase64]
      properties:
        templateVersion: { $ref: '#/components/schemas/RosterTemplateVersion' }
        fileHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        totalRows: { type: integer, minimum: 0, maximum: 2000 }
        importedCount: { type: integer, minimum: 0, maximum: 2000 }
        duplicateCount: { type: integer, minimum: 0, maximum: 2000 }
        errorCount: { type: integer, minimum: 0, maximum: 2000 }
        rows:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/RosterRowResult' }
        errorReceiptFileName:
          oneOf: [{ type: string }, { type: 'null' }]
        errorReceiptBase64:
          oneOf: [{ type: string, format: byte }, { type: 'null' }]
    CustomerRosterEntryRequest:
      type: object
      required: [studentName, parentPhone]
      properties:
        studentName: { type: string, minLength: 1, maxLength: 100 }
        parentPhone: { type: string, pattern: '^(?:\\+?86)?1[3-9][0-9]{9}$' }
      additionalProperties: false
    ManagementCustomerRosterEntryRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerRosterEntryRequest'
        - type: object
          required: [campusId]
          properties:
            campusId: { type: string, format: uuid }
    TeacherRosterEntryRequest:
      type: object
      required: [teacherName, phone]
      properties:
        teacherName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, pattern: '^(?:\\+?86)?1[3-9][0-9]{9}$' }
      additionalProperties: false
    ManagementTeacherRosterEntryRequest:
      allOf:
        - $ref: '#/components/schemas/TeacherRosterEntryRequest'
        - type: object
          required: [campusId]
          properties:
            campusId: { type: string, format: uuid }
    TeacherRosterView:
      type: object
      required: [id, teacherName, maskedPhone, campusId, campusName, status]
      properties:
        id: { type: string, format: uuid }
        teacherName: { type: string }
        maskedPhone: { type: string, description: Masked phone; full phone is only present in confirmed XLSX exports. }
        campusId: { type: string, format: uuid }
        campusName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    RosterPreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RosterPreviewView' }
    RosterImportEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RosterImportView' }
    RosterRowEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RosterRowResult' }
    TeacherRosterPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [meta]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TeacherRosterView' }
            meta: { $ref: '#/components/schemas/PaginationMeta' }
    GroupCampaignStatus:
      type: string
      enum: [DRAFT, ACTIVE, CLOSED, CANCELLED]
    GroupTeamStatus:
