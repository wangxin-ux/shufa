openapi: 3.1.0
info:
  title: Education Mini Program API
  version: 0.1.0
  description: >-
    Shared API contract for the first-phase education mini program. Successful
    responses use a data envelope and failures preserve their HTTP status.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Environment-relative service root
tags:
  - name: Finance
    description: Headquarters finance receipt registration and package issuance
  - name: System
    description: Service health and operational endpoints
  - name: Auth
    description: Local identity exchange and staff binding endpoints
  - name: Teacher
    description: Teacher-scoped teaching workflow endpoints
  - name: Parent
    description: Parent-scoped student, lesson, balance, attendance, and feedback endpoints
  - name: Partner
    description: Read-only branch operating data scoped to one assigned partner campus
  - name: CampusManager
    description: Branch-campus administrator operations scoped to one assigned campus
  - name: Management
    description: Super-admin-only earning rule, review, and manual payout endpoints
security:
  - bearerAuth: []
paths:
  /finance/receipts/{receiptId}/corrections:
    $ref: './finance-corrections.openapi.yaml#/submit'
  /finance/corrections:
    $ref: './finance-corrections.openapi.yaml#/list'
  /finance/corrections/{id}:
    $ref: './finance-corrections.openapi.yaml#/detail'
  /finance/corrections/{id}/actions:
    $ref: './finance-corrections.openapi.yaml#/actions'
  /finance/corrections/{id}/original-proof:
    $ref: './finance-corrections.openapi.yaml#/originalProof'
  /finance/corrections/{id}/replacement-proof:
    $ref: './finance-corrections.openapi.yaml#/replacementProof'
  /management/finance-corrections:
    $ref: './finance-corrections.openapi.yaml#/reviewList'
  /management/finance-corrections/{id}:
    $ref: './finance-corrections.openapi.yaml#/reviewDetail'
  /management/finance-corrections/{id}/actions:
    $ref: './finance-corrections.openapi.yaml#/reviewActions'
  /management/finance-corrections/{id}/original-proof:
    $ref: './finance-corrections.openapi.yaml#/reviewOriginalProof'
  /management/finance-corrections/{id}/replacement-proof:
    $ref: './finance-corrections.openapi.yaml#/reviewReplacementProof'
  /hr/teacher-record-attachments:
    $ref: './hr-records.openapi.yaml#/attachmentUpload'
  /hr/teacher-records/{recordId}:
    $ref: './hr-records.openapi.yaml#/record'
  /hr/teacher-records/{recordId}/archive:
    $ref: './hr-records.openapi.yaml#/archive'
  /hr/teacher-records/{recordId}/attachment:
    $ref: './hr-records.openapi.yaml#/attachment'
  /hr/teachers/{teacherId}/records:
    $ref: './hr-records.openapi.yaml#/records'
  /hr/campuses:
    $ref: './hr.openapi.yaml#/campuses'
  /hr/teachers:
    $ref: './hr.openapi.yaml#/teachers'
  /hr/reports/teaching:
    $ref: './hr-reports.openapi.yaml#/teaching'
  /hr/reports/earnings:
    $ref: './hr-reports.openapi.yaml#/earnings'
  /hr/reports/{kind}/export:
    $ref: './hr-reports.openapi.yaml#/export'
  /hr/teachers/{teacherId}:
    $ref: './hr.openapi.yaml#/teacher'
  /finance/receipts/{receiptId}/refund-quote:
    $ref: './finance-refunds.openapi.yaml#/quote'
  /finance/receipts/{receiptId}/refunds:
    $ref: './finance-refunds.openapi.yaml#/submit'
  /finance/refunds:
    $ref: './finance-refunds.openapi.yaml#/list'
  /finance/refunds/{id}:
    $ref: './finance-refunds.openapi.yaml#/detail'
  /finance/refunds/{id}/actions:
    $ref: './finance-refunds.openapi.yaml#/actions'
  /finance/refunds/{id}/payment-actions:
    $ref: './finance-refunds.openapi.yaml#/paymentActions'
  /finance/refund-proofs:
    $ref: './finance-refunds.openapi.yaml#/upload'
  /finance/refunds/{id}/proof:
    $ref: './finance-refunds.openapi.yaml#/proof'
  /management/finance-refunds:
    $ref: './finance-refunds.openapi.yaml#/reviewList'
  /management/finance-refunds/{id}:
    $ref: './finance-refunds.openapi.yaml#/reviewDetail'
  /management/finance-refunds/{id}/actions:
    $ref: './finance-refunds.openapi.yaml#/reviewActions'
  /management/finance-refunds/{id}/proof:
    $ref: './finance-refunds.openapi.yaml#/reviewProof'
  /finance/campuses:
    $ref: './finance.openapi.yaml#/campuses'
  /finance/students:
    $ref: './finance.openapi.yaml#/students'
  /finance/receipt-proofs:
    $ref: './finance.openapi.yaml#/proofUpload'
  /finance/receipts:
    $ref: './finance.openapi.yaml#/receipts'
  /finance/receipts/export:
    $ref: './finance.openapi.yaml#/receiptExport'
  /finance/receipts/{receiptId}:
    $ref: './finance.openapi.yaml#/receipt'
  /finance/receipts/{receiptId}/proof:
    $ref: './finance.openapi.yaml#/proof'
  /finance/receipts/{receiptId}/issue-package:
    $ref: './finance.openapi.yaml#/issue'
  /finance/reports/lesson-consumption:
    $ref: './finance-reports.openapi.yaml#/lessonConsumption'
  /finance/reports/refunds:
    $ref: './finance-reports.openapi.yaml#/refunds'
  /finance/reports/{kind}/export:
    $ref: './finance-reports.openapi.yaml#/export'
  /finance/hours:
    $ref: './finance-overview.openapi.yaml#/hours'
  /finance/oversight/orders:
    $ref: './finance-overview.openapi.yaml#/orders'
  /finance/oversight/orders/{orderId}/proof:
    $ref: './finance-overview.openapi.yaml#/orderProof'
  /finance/oversight/earnings:
    $ref: './finance-overview.openapi.yaml#/earnings'
  /finance/oversight/payouts:
    $ref: './finance-overview.openapi.yaml#/payouts'
  /finance/oversight/cash-flow:
    $ref: './finance-overview.openapi.yaml#/cashFlow'
  /finance/oversight/profitability:
    $ref: './finance-overview.openapi.yaml#/profitability'
  /finance/oversight/{kind}/export:
    $ref: './finance-overview.openapi.yaml#/export'
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      description: Returns the process health without requiring authentication.
      tags:
        - System
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service is healthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessEnvelope'
              examples:
                healthy:
                  value:
                    data:
                      status: ok
                    requestId: 64ea9657-41f1-4baf-a3fb-d62e39054016
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: login
      summary: Exchange a login code for a local session
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/staff/bind:
    post:
      operationId: bindStaffIdentity
      summary: Bind a pre-created staff account with a one-time token
      tags:
        - Auth
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffBindRequest'
      responses:
        '200':
          description: Staff identity was bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/wechat/login:
    post:
      operationId: loginWithWechat
      summary: Exchange a trusted WeChat login code for a bound staff session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WechatLoginRequest' }
      responses:
        '200':
          description: The bound staff identity was authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/wechat/staff/bind-phone:
    post:
      operationId: bindWechatStaffByPhone
      summary: Bind the current WeChat identity to one pre-created staff account
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, phoneCode]
              properties:
                code: { type: string, minLength: 1, maxLength: 256 }
                phoneCode: { type: string, minLength: 1, maxLength: 256 }
              additionalProperties: false
      responses:
        '200':
          description: The staff account was bound and authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user and role scopes
      tags:
        - Auth
      responses:
        '200':
          description: Current user and scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/dashboard:
    get:
      operationId: getTeacherDashboard
      summary: Read the authenticated teacher dashboard
      tags:
        - Teacher
      responses:
        '200':
          description: Teacher dashboard data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDashboardEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/profile:
    get:
      operationId: getTeacherProfile
      summary: Read the authenticated teacher profile
      tags:
        - Teacher
      responses:
        '200':
          description: Teacher profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions:
    get:
      operationId: listTeacherLessonSessions
      summary: List lesson sessions assigned to the authenticated teacher
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDateTime'
        - $ref: '#/components/parameters/ToDateTime'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LessonSessionStatus'
      responses:
        '200':
          description: Paginated lesson sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonSessionsPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions/{lessonSessionId}:
    get:
      operationId: getTeacherLessonSession
      summary: Read an assigned lesson session and its roster
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/LessonSessionId'
      responses:
        '200':
          description: Lesson session detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions/{lessonSessionId}/attendance:
    put:
      operationId: saveTeacherAttendance
      summary: Save a complete attendance draft for an assigned lesson
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/LessonSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceDraft'
      responses:
        '200':
          description: Attendance draft saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions/{lessonSessionId}/complete:
    post:
      operationId: completeTeacherLessonSession
      summary: Complete an assigned lesson and consume student lesson units
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/LessonSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLessonRequest'
      responses:
        '200':
          description: Lesson completion result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteLessonEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions/{lessonSessionId}/reverse:
    post:
      operationId: reverseTeacherLessonSession
      summary: Reverse a completed lesson within the teacher reversal window
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/LessonSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseLessonRequest'
      responses:
        '200':
          description: Lesson reversal result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteLessonEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions/{lessonSessionId}/students/{studentId}/feedback:
    put:
      operationId: upsertTeacherStudentFeedback
      summary: Save feedback for a student in an assigned lesson
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/LessonSessionId'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackUpsertRequest'
      responses:
        '200':
          description: Feedback was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentFeedbackEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-sessions/{lessonSessionId}/students/{studentId}/feedback-images:
    post:
      operationId: uploadTeacherStudentFeedbackImage
      summary: Upload one staged image for a student feedback draft
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/LessonSessionId'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
              additionalProperties: false
      responses:
        '200':
          description: Validated staged feedback image metadata and short-lived access URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackImageUploadEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/students:
    get:
      operationId: listTeacherStudents
      summary: List students in classes assigned to the authenticated teacher
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Paginated teacher students.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherStudentsPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/students/{studentId}:
    get:
      operationId: getTeacherStudent
      summary: Read teaching-only detail for one student assigned to the authenticated teacher
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student classes, next lesson, attendance and latest feedback within the teacher scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherStudentDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/teaching-records:
    get:
      operationId: listTeacherTeachingRecords
      summary: List teaching records for the authenticated teacher
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDateTime'
        - $ref: '#/components/parameters/ToDateTime'
      responses:
        '200':
          description: Paginated teaching records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingRecordsPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/lesson-ledger:
    get:
      operationId: listTeacherLessonLedger
      summary: List lesson-ledger summaries caused by the authenticated teacher sessions
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDateTime'
        - $ref: '#/components/parameters/ToDateTime'
      responses:
        '200':
          description: Paginated teacher lesson-ledger summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherLessonLedgerPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/earnings/summary:
    get:
      operationId: getTeacherEarningSummary
      summary: Read internal estimated earning totals for the authenticated teacher
      tags:
        - Teacher
      responses:
        '200':
          description: Teacher earning totals calculated by the backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherEarningSummaryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/earning-rule:
    get:
      operationId: getCurrentTeacherEarningRule
      summary: Read the currently effective earning rule for the authenticated teacher
      tags:
        - Teacher
      responses:
        '200':
          description: Current rule, or null when the rule is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherEarningRuleEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/earnings:
    get:
      operationId: listTeacherEarnings
      summary: List immutable earning entries for the authenticated teacher
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/FromDateTime'
        - $ref: '#/components/parameters/ToDateTime'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TeacherEarningStatus'
      responses:
        '200':
          description: Paginated teacher earning entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherEarningsPageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /teachers/me/withdrawals:
    get:
      operationId: listTeacherWithdrawals
      summary: List withdrawal requests for the authenticated teacher
      tags:
        - Teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
