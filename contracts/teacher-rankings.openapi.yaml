rankings:
  get:
    operationId: listTeacherMonthlyRankings
    summary: Read campus teacher ranks and the caller's own metric
    description: >-
      Requires TEACHER_EARNING_READ_OWN and a current active single-role TEACHER
      with an active teacher profile in the same campus. No caller-supplied
      campus or teacher scope is accepted. Current authorization is rechecked
      after a RepeatableRead snapshot. Each lesson belongs to the calendar month
      of its startsAt in the campus timezone. ATTENDANCE counts PRESENT rows in
      completed, non-reversed lessons with matching completed teaching records;
      the same student in separate lessons counts separately. EARNINGS uses
      existing matching earning bases and immutable entry amounts, including
      pending review and available accruals, excluding rejected/invalid sources;
      valid reversal pairs net to zero in the lesson's original month.
      Only positive totals receive competition ranks (1,1,3). Peers expose
      display names and ranks, never IDs or metric values. Only own.value
      exposes the caller's metric, in integer fen or attendee visits.
      Historical months and previous ranks are recalculated from currently
      valid facts, not frozen settlement reports. A missing positive previous
      rank yields null comparison. Default month is the campus's current month;
      future months are rejected. Pages after page 1 require revision, a SHA-256
      fingerprint including both months, scope and calculation version.
      Changed data or comparison returns 409; restart from page 1.
    tags: [Teacher]
    security: [{ bearerAuth: [] }]
    parameters:
      - name: metric
        in: query
        schema: { type: string, enum: [EARNINGS, ATTENDANCE], default: EARNINGS }
      - name: month
        in: query
        schema: { type: string, pattern: '^[1-9][0-9]{3}-(0[1-9]|1[0-2])$' }
      - name: revision
        in: query
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      - { $ref: './openapi.yaml#/components/parameters/Page' }
      - { $ref: './openapi.yaml#/components/parameters/PageSize' }
    responses:
      '200':
        description: Independent rank page and private own summary.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/schemas/RankingPage' }
                requestId: { type: string }
      '400': { $ref: './openapi.yaml#/components/responses/BadRequest' }
      '401': { $ref: './openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: './openapi.yaml#/components/responses/Forbidden' }
      '409':
        description: CONFLICT; source data or the page comparison changed. Refresh the ranking.
        content:
          application/json:
            schema: { $ref: './openapi.yaml#/components/schemas/ErrorEnvelope' }
schemas:
  Row:
    type: object
    additionalProperties: false
    required: [position, displayName, rank, previousRank, rankDelta, isSelf]
    properties:
      position: { type: integer, minimum: 1 }
      displayName: { type: string }
      rank: { type: integer, minimum: 1 }
      previousRank: { type: [integer, 'null'], minimum: 1 }
      rankDelta: { type: [integer, 'null'] }
      isSelf: { type: boolean }
  Own:
    type: object
    additionalProperties: false
    required: [value, rank, previousRank, rankDelta, hasActivity]
    properties:
      value: { type: integer, minimum: 0, maximum: 9007199254740991 }
      rank: { type: [integer, 'null'], minimum: 1 }
      previousRank: { type: [integer, 'null'], minimum: 1 }
      rankDelta: { type: [integer, 'null'] }
      hasActivity: { type: boolean }
  RankingPage:
    type: object
    additionalProperties: false
    required: [metric, month, timezone, asOf, revision, rows, own, meta]
    properties:
      metric: { type: string, enum: [EARNINGS, ATTENDANCE] }
      month: { type: string }
      timezone: { type: string }
      asOf: { type: string, format: date-time }
      revision: { type: string, pattern: '^[a-f0-9]{64}$' }
      rows: { type: array, items: { $ref: '#/schemas/Row' } }
      own: { $ref: '#/schemas/Own' }
      meta:
        type: object
        additionalProperties: false
        required: [page, pageSize, total, totalPages]
        properties:
          page: { type: integer, minimum: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100 }
          total: { type: integer, minimum: 0 }
          totalPages: { type: integer, minimum: 0 }
