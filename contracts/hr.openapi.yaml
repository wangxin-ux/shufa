campuses:
  get:
    operationId: listHrCampuses
    summary: List campus choices for headquarters HR
    tags: [HR]
    description: Single headquarters HR identity and HR_TEACHER_READ only. Returns no parent or financial data.
    parameters:
      - { $ref: '#/parameters/Page' }
      - { $ref: '#/parameters/PageSize' }
      - { $ref: '#/parameters/Query' }
    responses:
      '200':
        description: Paginated campus directory.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  allOf:
                    - { $ref: '#/schemas/Page' }
                    - type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            type: object
                            required: [id, name]
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
      '400': { $ref: './openapi.yaml#/components/responses/BadRequest' }
      '401': { $ref: './openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: './openapi.yaml#/components/responses/Forbidden' }
teachers:
  get:
    operationId: listHrTeachers
    summary: Read existing teachers across campuses
    tags: [HR]
    description: HR_TEACHER_READ only. Active requires an active teacher profile and active user account. No identity mutations or personal phone fields.
    parameters:
      - { $ref: '#/parameters/Page' }
      - { $ref: '#/parameters/PageSize' }
      - { $ref: '#/parameters/Query' }
      - { name: campusId, in: query, schema: { type: string, format: uuid } }
      - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
    responses:
      '200':
        description: Paginated teacher directory ordered by name and stable ID.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  allOf:
                    - { $ref: '#/schemas/Page' }
                    - type: object
                      required: [items]
                      properties:
                        items: { type: array, items: { $ref: '#/schemas/Teacher' } }
      '400': { $ref: './openapi.yaml#/components/responses/BadRequest' }
      '401': { $ref: './openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: './openapi.yaml#/components/responses/Forbidden' }
teacher:
  get:
    operationId: getHrTeacher
    summary: Read existing teacher profile and effective teaching total
    tags: [HR]
    description: HR_TEACHER_READ only. Lifetime completedLessonCount counts COMPLETED teaching records and excludes REVERSED records. createdAt is profile creation time, not employment start date; displayed in Asia/Shanghai.
    parameters:
      - { name: teacherId, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Minimal teacher profile, without student records or earnings.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  allOf:
                    - { $ref: '#/schemas/Teacher' }
                    - type: object
                      required: [createdAt, completedLessonCount]
                      properties:
                        createdAt: { type: string, format: date-time }
                        completedLessonCount: { type: integer, minimum: 0 }
      '400': { $ref: './openapi.yaml#/components/responses/BadRequest' }
      '401': { $ref: './openapi.yaml#/components/responses/Unauthorized' }
      '403': { $ref: './openapi.yaml#/components/responses/Forbidden' }
      '404':
        description: Teacher profile not found.
        content:
          application/json:
            schema: { $ref: './openapi.yaml#/components/schemas/ErrorEnvelope' }
parameters:
  Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
  PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
  Query: { name: query, in: query, schema: { type: string, maxLength: 100 } }
schemas:
  Page:
    type: object
    required: [total, page, pageSize]
    properties:
      total: { type: integer, minimum: 0 }
      page: { type: integer, minimum: 1 }
      pageSize: { type: integer, minimum: 1, maximum: 50 }
  Teacher:
    type: object
    required: [id, name, campusId, campusName, employeeCode, active, specialties, activeClassCount]
    properties:
      id: { type: string, format: uuid }
      name: { type: string }
      campusId: { type: string, format: uuid }
      campusName: { type: string }
      employeeCode: { type: string }
      active: { type: boolean }
      specialties: { type: array, items: { type: string } }
      activeClassCount: { type: integer, minimum: 0 }
