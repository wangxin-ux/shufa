        giftAvailableUnits:
          type: integer
          minimum: 0
        availableTotalUnits:
          type: integer
          minimum: 0
        mainReservedUnits:
          type: integer
          minimum: 0
        giftReservedUnits:
          type: integer
          minimum: 0
        reservedTotalUnits:
          type: integer
          minimum: 0
        studentId:
          type: string
          format: uuid
        studentName:
          type: string
          minLength: 1
          maxLength: 100
        classNames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        mainBalanceUnits:
          type: integer
          minimum: 0
        giftBalanceUnits:
          type: integer
          minimum: 0
        totalBalanceUnits:
          type: integer
          minimum: 0
        thresholdUnits:
          type: integer
          minimum: 0
