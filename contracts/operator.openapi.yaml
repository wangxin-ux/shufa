    OperatorLeaveRequestView:
      type: object
      required:
        - id
        - studentId
        - studentName
        - lessonSessionId
        - courseName
        - startsAt
        - reason
        - status
        - reviewerName
        - reviewedAt
        - reviewReason
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        studentName:
          type: string
          minLength: 1
          maxLength: 100
        lessonSessionId:
          type: string
          format: uuid
        courseName:
          type: string
          minLength: 1
          maxLength: 200
        startsAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500
        status:
          $ref: ./openapi.yaml#/components/schemas/ParentLeaveStatus
        canReview:
          type: boolean
          description: >-
            Current relationship capability, always included by current list and fresh review responses.
            False for reviewed rows or unavailable membership. Legacy successful idempotency replay
            responses may omit this field; clients must treat missing or false as unavailable.
            This snapshot does not replace the command's current authorization/version checks.
        reviewerName:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        reviewedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        reviewReason:
          oneOf:
            - type: string
              maxLength: 500
            - type: 'null'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    OperatorVersionedReviewLeaveRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
        reviewReason:
          type: string
          maxLength: 500
      additionalProperties: false
    OperatorVersionedRejectLeaveRequest:
