        - startsAt
        - endsAt
        - kind
        - lessonUnits
        - status
        - version
      properties:
        seriesId:
          type: [string, 'null']
          format: uuid
          description: Optional for old successful idempotent receipts; null for ordinary unlinked sessions.
        id:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
        classGroupId:
          type: string
          format: uuid
        className:
          type: string
          minLength: 1
          maxLength: 200
        courseName:
          type: string
          minLength: 1
          maxLength: 200
        teacherId:
          type: string
          format: uuid
        teacherName:
          type: string
          minLength: 1
          maxLength: 100
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        kind:
