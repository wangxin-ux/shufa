    OperatorCampusView:
      type: object
      required:
        - id
        - code
        - name
        - timezone
        - contactPhone
        - address
        - lessonWarningThresholdUnits
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 50
        contactPhone:
          oneOf:
            - type: string
              maxLength: 30
            - type: 'null'
        address:
          oneOf:
            - type: string
              maxLength: 300
            - type: 'null'
        lessonWarningThresholdUnits:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    OperatorVersionedUpdateCampusRequest:
      type: object
      required:
        - version
        - name
        - contactPhone
        - address
        - lessonWarningThresholdUnits
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: .*\S.*
        contactPhone:
          oneOf:
            - type: string
              maxLength: 30
              pattern: ^(?:1[3-9][0-9]{9}|0[0-9]{2,3}-?[0-9]{7,8})$
            - type: 'null'
        address:
          oneOf:
            - type: string
              maxLength: 300
            - type: 'null'
        lessonWarningThresholdUnits:
          type: integer
          minimum: 0
      additionalProperties: false
