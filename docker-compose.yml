services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: education_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d education_app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: education_app_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d education_app_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
      - ./contracts:/app/contracts
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
